# Experiment name: rubik_train_policy_shuffle_70
# Description: This experiments is part of experiments for investigate the influence of the noise in the training data on the performance of the model.
# Trajectories were generated by random policy and have length 70.

algorithm:
  _target_: carl.algorithms.train_supervised.TrainSupervisedHF
  custom_logger:
    _target_: carl.utils.loggers.NeptuneCaRLLogger
    name: "rubik_policy_training_n_490k_length_of_trajectories_70"
    description: "rubik_policy_training_n_490k_length_of_trajectories_70"
    project: "pmtest/subexit"
    tags: "rubik_policy_training_n_490k_length_of_trajectories_70"
    log_parameters: False
  datamodule:
    _target_: carl.dataloader.game_data_module.GameDataModule
    env:
      _target_: carl.environment.gym_rubik.rubik_env.RubikCubeEnv
      tokenizer:
        _target_: carl.environment.gym_rubik.tokenizer.RubikCubeTokenizer
        cut_distance: 20
        type_of_value_training: "regression"
    dataset_path: ""
    save_tokenized_dataset_path: ""
    training_goal: policy
    num_of_trajectories: 490000
    trajectory_length: null
    validation_split: 0.1
    num_workers: 1
  trainer:
    _partial_: True
    _target_: transformers.Trainer
    args:
      _target_: transformers.TrainingArguments
      output_dir: "models_weights/rubik/baseline_policy"
      overwrite_output_dir: False
      evaluation_strategy: epoch
      per_device_train_batch_size: 512
      per_device_eval_batch_size: 512
      learning_rate: 0.0001
      weight_decay: 0.0001
      num_train_epochs: 1000
      lr_scheduler_type: linear
      log_level: info
      logging_strategy: epoch
      save_strategy: epoch
      save_total_limit: 1
      load_best_model_at_end: True
      metric_for_best_model: eval_loss
      warmup_steps: 1000
      report_to: none
  model:
    _partial_: True
    _target_: transformers.BertForSequenceClassification
  config:
    _target_: transformers.BertConfig
    hidden_size: 512
    intermediate_size: 512
    max_position_embeddings: 512
    num_attention_heads: 4
    num_hidden_layers: 6
    vocab_size: 13
    num_labels: 12
  custom_metrics:
    _target_: carl.components.metrics.PolicyMetricsHF

  do_finetune: False
  path_to_model_weights: null


carl_grid:
  algorithm.config.hidden_size: [512]
  algorithm.config.intermediate_size: [512]
  algorithm.config.max_position_embeddings: [512]
  algorithm.config.num_attention_heads: [4]
  algorithm.config.num_hidden_layers: [6]
  algorithm.trainer.args.learning_rate: [?]
  algorithm.trainer.args.weight_decay: [?]
  algorithm.trainer.args.warmup_steps: [?]


  algorithm.datamodule.dataset_path: ["/net/pr2/projects/plgrid/plggrl_algo/validation/rubik/offiline/shuffle_70"]
  algorithm.datamodule.save_tokenized_dataset_path: [ "/net/pr2/projects/plgrid/plggrl_algo/validation/rubik/tokenized_offline/baseline_policy_shuffle_70"]
