algorithm:
  _target_: carl.algorithms.solve_instances.SolveInstances

  # solver class
  solver_class:
    _target_: carl.solver.subgoal_search.Solver
    max_nodes: None
    planner_class:
      _partial_: true
      _target_: carl.solver.planners.BestFSPlanner

    subgoal_generator:
      _target_: carl.inference_components.subgoal_generator.AdaptiveSubgoalGenerator
      generator_k_list: None
      env:
        _target_: carl.environment.sokoban.env.SokobanEnv
        tokenizer:
          _target_: carl.environment.sokoban.tokenizer.SokobanTokenizer
          cut_distance: None
          type_of_value_training: regression
          size_of_board:
            - 12
            - 12
          remove_border: False
        num_boxes: 4
      subgoal_generation_kwargs:
        max_new_tokens: 145
        do_sample: False
        temperature: 1.0
        num_beams: None
        num_return_sequences: None
      subgoal_generators: None

    # validator
    validator:
      _target_: carl.inference_components.validator.BasicValidator
      env:
        _target_: carl.environment.sokoban.env.SokobanEnv
        tokenizer:
          _target_: carl.environment.sokoban.tokenizer.SokobanTokenizer
          cut_distance: None
          type_of_value_training: "regression"
          size_of_board:
            - 12
            - 12
        num_boxes: 4

      # conditional low level policy
      cllp:
        _target_: carl.inference_components.conditional_low_level_policy.TransformerConditionalLowLevelPolicy
        conditional_low_level_policy:
          _target_: hydra.utils.get_class
          path: transformers.BertForSequenceClassification

        path_to_conditional_low_level_policy_weights: ""
        env:
          _target_: carl.environment.sokoban.env.SokobanEnv
          tokenizer:
            _target_: carl.environment.sokoban.tokenizer.SokobanTokenizer
            cut_distance: None
            type_of_value_training: "regression"
            size_of_board:
              - 12
              - 12
          num_boxes: 4
      budget_for_achieving_subgoal: None

    # value function
    value_function:
      _target_: carl.inference_components.value.TransformerValue
      value_network:
        _target_: hydra.utils.get_class
        path: transformers.BertForSequenceClassification

      path_to_value_network_weights: ""
      type_of_evaluation: "regression"
      noise_variance: 0.0
      env:
        _target_: carl.environment.sokoban.env.SokobanEnv
        tokenizer:
          _target_: carl.environment.sokoban.tokenizer.SokobanTokenizer
          cut_distance: None
          type_of_value_training: "regression"
          size_of_board:
            - 12
            - 12
        num_boxes: 4

  # data loader class
  data_loader_class:
    _target_: carl.environment.instance_generator.BasicInstanceGenerator
    generator:
      _target_: carl.environment.instance_generator.GeneralIterableDataLoader
      path_to_folder_with_data: ""
    batch_size: 10

  # result logger
  result_logger:
    _target_: carl.utils.result_loggers.SubgoalSearchResultLogger
    custom_logger:
      _target_: carl.utils.loggers.NeptuneCaRLLogger
      name: None
      description: ""
      project: "pmtest/subexit"
      tags: None
      log_parameters: False
    problem_to_solve: ${algorithm.problem_to_solve}
    budget_logs: [50, 60, 70, 80, 90, 100, 120, 140, 160, 180, 200, 250, 300, 350, 400, 450, 500, 600, 800, 1000, 2000, 2500, 3000, 4000, 5000]
  problem_to_solve: 50

  n_parallel_workers: 10

carl_grid:
  algorithm.solver_class.max_nodes: [2000]

  algorithm.solver_class.subgoal_generator.env.tokenizer.cut_distance: [150]
  algorithm.solver_class.subgoal_generator.subgoal_generation_kwargs.num_return_sequences: [2]
  algorithm.solver_class.subgoal_generator.subgoal_generation_kwargs.do_sample: [False]
  algorithm.solver_class.subgoal_generator.subgoal_generation_kwargs.temperature: [1.0]
  algorithm.solver_class.subgoal_generator.subgoal_generation_kwargs.num_beams: [8]


#  algorithm.solver_class.subgoal_generator.path_to_generator_weights: [""]
  algorithm.solver_class.subgoal_generator.generator_k_list: [[8]]
  algorithm.solver_class.subgoal_generator.subgoal_generators: [[
        "./validation/sokoban/components/full_data/generator/border/8/checkpoint-75856",
#        "./validation/sokoban/components/full_data/generator/border/4/checkpoint-75856",
#        "./validation/sokoban/components/full_data/generator/border/1/checkpoint-151712",
  ]]
  algorithm.solver_class.validator.cllp.path_to_conditional_low_level_policy_weights: ["./validation/sokoban/components/full_data/cllp/8/checkpoint-167585"]
  algorithm.solver_class.value_function.path_to_value_network_weights: ["./validation/sokoban/components/full_data/value/checkpoint-1343100"]

  algorithm.data_loader_class.generator.path_to_folder_with_data: ["./validation/sokoban/progress/12_12_4"]

  algorithm.solver_class.validator.env.tokenizer.cut_distance: [150]
  algorithm.solver_class.validator.budget_for_achieving_subgoal: [10]

  algorithm.solver_class.value_function.env.tokenizer.cut_distance: [150]

  algorithm.result_logger.custom_logger.name: ["sokoban_subgoal_search"]
  algorithm.result_logger.custom_logger.tags: [["sokoban", "kSubS", "solve", "k_8", "12x12x4"]]
