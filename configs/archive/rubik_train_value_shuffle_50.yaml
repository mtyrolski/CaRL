# Experiment name: rubik_train_value_shuffle_50
# Description: This experiments is part of experiments for investigate the influence of the noise in the training data on the performance of the model.
# Trajectories were generated by random policy and have length 50.

algorithm:
  _target_: carl.algorithms.train_supervised.TrainSupervisedHF
  custom_logger:
    _target_: carl.custom_logger.loggers.NeptuneCaRLLogger
    name: "rubik_value_training_n_49000_length_of_trajectories_50"
    description: "rubik_value_training_n_49000_length_of_trajectories_50"
    project: "pmtest/subexit"
    tags: "rubik_value_training_n_49000_length_of_trajectories_50"
    log_parameters: False
  datamodule:
    _target_: carl.dataloader.game_data_module.GameDataModule
    env:
      _target_: carl.environment.gym_rubik.rubik_env.RubikCubeEnv
      tokenizer:
        _target_: carl.environment.gym_rubik.tokenizer.RubikCubeTokenizer
        cut_distance: 50
        type_of_value_training: "regression"

    dataset_path: ""
    save_tokenized_dataset_path: ""
    training_goal: "value"
    validation_split: 0.1
    num_of_trajectories: 49000
    num_workers: 1
  custom_metrics:
    _target_: carl.components.metrics.ValueMetricsHF
    type_of_evaluation: "regression"
  trainer:
    _partial_: True
    _target_: transformers.Trainer
    args:
      _target_: transformers.TrainingArguments
      output_dir: "models_weights/value"
      overwrite_output_dir: False
      evaluation_strategy: epoch
      per_device_train_batch_size: 5000
      per_device_eval_batch_size: 5000
      learning_rate: 0.0001
      weight_decay: 0.0001
      num_train_epochs: 10000
      lr_scheduler_type: "linear"
      log_level: info
      logging_strategy: epoch
      save_strategy: epoch
      save_total_limit: 1
      load_best_model_at_end: True
      metric_for_best_model: eval_loss
      report_to: none
      warmup_steps: 2000
  model:
    _partial_: True
    _target_: transformers.BertForSequenceClassification
  config:
    _target_: transformers.BertConfig
    hidden_size: 512
    intermediate_size: 512
    max_position_embeddings: 512
    num_attention_heads: 2
    num_hidden_layers: 1
    vocab_size: 13
    num_labels: 1

  do_finetune: False
  path_to_model_weights: null

# Other config
float32_matmul_precision: high

carl_grid:
  algorithm.config.hidden_size: [128]
  algorithm.config.intermediate_size: [128]
  algorithm.config.max_position_embeddings: [256]
  algorithm.config.num_attention_heads: [2]
  algorithm.config.num_hidden_layers: [1]
  algorithm.trainer.args.learning_rate: [3e-7]
  algorithm.trainer.args.weight_decay: [0.00001]
  algorithm.trainer.args.warmup_steps: [50000]


  algorithm.datamodule.dataset_path: [ "/net/pr2/projects/plgrid/plggrl_algo/validation/rubik/offiline/shuffle_50" ]
  algorithm.datamodule.save_tokenized_dataset_path: [ "/net/pr2/projects/plgrid/plggrl_algo/validation/rubik/tokenized_offline/value_shuffle_50" ]
