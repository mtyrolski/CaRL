# Experiment name: sokoban_train_generator
# Trajectories were generated by MCTS agent.

algorithm:
  _target_: carl.algorithms.train_supervised.TrainSupervisedHF
  custom_logger:
    _target_: carl.custom_logger.loggers.NeptuneCaRLLogger
    name: "sokoban_train_generator_remove_border_10_10_4_fin"
    description: "sokoban_train_generator_remove_border_10_10_4_fin"
    project: "pmtest/subexit"
    tags: ["sokoban", "train_generator", "remove_border", "10_10_4", "fin"]
    log_parameters: False
  datamodule:
    _target_: carl.dataloader.game_data_module.GameDataModule
    env:
      _target_: carl.environment.sokoban.env.SokobanEnv
      tokenizer:
        _target_: carl.environment.sokoban.tokenizer.SokobanTokenizer
        cut_distance: 150
        remove_border: True
        type_of_value_training: "regression"
        size_of_board:
          - 8
          - 8
      num_boxes: 4
    dataset_path: ""
    save_tokenized_dataset_path: ""
    training_goal: "generator"
    subgoal_distance_interval: [8]
    validation_split: 0.01
    num_workers: 1
  custom_metrics:
    _target_: carl.components.metrics.GeneratorMetricsHF
  trainer:
    _partial_: True
    _target_: transformers.Trainer
    args:
      _target_: transformers.TrainingArguments
      output_dir: "models_weights/sokoban/generator_remove_border_fin"
      overwrite_output_dir: False
      evaluation_strategy: epoch
      per_device_train_batch_size: 1024
      per_device_eval_batch_size: 1024
      learning_rate: 0.0001
      weight_decay: 0.0001
      num_train_epochs: 10000
      lr_scheduler_type: linear
      log_level: info
      logging_strategy: epoch
      save_strategy: epoch
      save_total_limit: 1
      load_best_model_at_end: True
      metric_for_best_model: eval_loss
      report_to: none
      warmup_steps: 2000
  model:
    _partial_: True
    _target_: transformers.BartForConditionalGeneration
  config:
    _target_: transformers.BartConfig
    vocab_size: 22
    d_model: 512
    encoder_layers: 1
    decoder_layers: 1
    encoder_attention_heads: 1
    decoder_attention_heads: 1
    encoder_ffn_dim: 1024
    decoder_ffn_dim: 1024
    dropout: 0.1
    max_position_embeddings: 512

  do_finetune: False
  path_to_model_weights: null

# Other config
float32_matmul_precision: high

carl_grid:
  algorithm.config.d_model: [256]
  algorithm.config.decoder_attention_heads: [4]
  algorithm.config.decoder_ffn_dim: [1024]
  algorithm.config.decoder_layers: [3]
  algorithm.config.encoder_attention_heads: [4]
  algorithm.config.encoder_ffn_dim: [2048]
  algorithm.config.encoder_layers: [3]
  algorithm.config.dropout: [0.1]
  algorithm.config.max_position_embeddings: [256]
  algorithm.trainer.args.learning_rate: [1e-4]
  algorithm.trainer.args.weight_decay: [0.0001]
  algorithm.trainer.args.warmup_steps: [1000]
  algorithm.datamodule.subgoal_distance_interval: [[16], [32]]

  algorithm.datamodule.dataset_path: ["/net/pr2/projects/plgrid/plggrl_algo/validation/sokoban/offline/fin_10_10_4"]
  algorithm.datamodule.save_tokenized_dataset_path: ["/net/pr2/projects/plgrid/plggrl_algo/validation/sokoban/tokenized_offline/generator_remove_border_fin"]
