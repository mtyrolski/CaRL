algorithm:
  # main algorithm
  _target_: carl.algorithms.training_loop.TrainingLoopHF
    # general algorithm parameters
  n_iterations: 1000

  result_logger:
    _target_: carl.solve_instances.result_loggers.SubgoalSearchResultLogger
    custom_logger:
      _target_: carl.custom_logger.loggers.NeptuneCaRLLogger
      project: "pmtest/subexit"
      name: "rlloop"
      description: "rlloop"
      tags: "rlloop"
      log_parameters: False
    budget_logs:
      - 100
      - 500
      - 1000
      - 5000

  # planner ,i.e. algorithm to solve instances
  # It is partial because it is initialized with the state (i.e. the environment)
  planner_class:
    _partial_: True
    _target_: carl.solver.planners.BestFSPlanner
  max_solver_nodes: 500

  # environment; it is the same for all components
  env:
    _target_: carl.environment.sokoban.env.SokobanEnv
    tokenizer:
      _target_: carl.environment.sokoban.tokenizer.SokobanTokenizer
      cut_distance: 100
      type_of_value_training: regression
      size_of_board:
        - 12
        - 12
    num_boxes: 4

  # params for replay buffers
  subgoal_generator_replay_buffer_size: 50000
  subgoal_generator_distance_range: 8
  value_function_replay_buffer_size: 50000
  cllp_replay_buffer_size: 50000
  cllp_distance_range: 8
  replay_buffer_data_split: 0.1

  # params for instances generator
  # this data is used during collecting data for replay buffers
  generated_data_path: "data/online_data/sokoban_12x12x4"
  instance_generator_batch_size: 256
  # this data is used pure evaluation
  eval_data_path: ""
  eval_batch_size: 256
  evaluate_every: 3

  # TODO: what is this?
  add_first_batch_to_node_computations: True

  # path to save the models:
  weights_dump_path: ""

  # params for components:
  # generator:
  subgoal_generator_path: "./data/components/weights/generator/n_56000/k_8/checkpoint-56672"
  generator_network:
    _target_: hydra.utils.get_class
    path: transformers.BartForConditionalGeneration
  generator_inference_class:
    _target_: hydra.utils.get_class
    path: carl.inference_components.subgoal_generator.TransformerSubgoalGenerator
  subgoal_generation_kwargs:
    max_new_tokens: 145
    num_beams: 16
    num_return_sequences: 4

  # cllp
  cllp_path: "./data/components/weights/cllp/n_56000/k_8/checkpoint-126160"
  cllp_network:
    _target_: hydra.utils.get_class
    path: transformers.BertForSequenceClassification
  cllp_inference_class:
    _target_: hydra.utils.get_class
    path: carl.inference_components.conditional_low_level_policy.TransformerConditionalLowLevelPolicy

  # value
  value_function_path: "./data/components/weights/value/regression/n_56000/checkpoint-52548"
  value_netwrok:
    _target_: hydra.utils.get_class
    path: transformers.BertForSequenceClassification
  value_inference_class:
    _target_: hydra.utils.get_class
    path: carl.inference_components.value.TransformerValue
  value_type_of_evaluation: "regression"

  # validator
  validator_inference_class:
    _target_: hydra.utils.get_class
    path: carl.inference_components.validator.BasicValidator
  budget_for_achieving_subgoal: 10

  # Trainers:
  # generator:
  subgoal_generator_trainer_class:
    _target_: hydra.utils.get_class
    path: transformers.Trainer
  subgoal_generator_trainer_args:
    _partial_: True
    _target_: transformers.TrainingArguments
    overwrite_output_dir: False
    evaluation_strategy: epoch
    per_device_train_batch_size: 256
    per_device_eval_batch_size: 256
    learning_rate: 0.0001
    weight_decay: 0.0001
    num_train_epochs: 2
    lr_scheduler_type: linear
    logging_strategy: epoch
    save_strategy: epoch
    save_total_limit: 1
    load_best_model_at_end: True
    metric_for_best_model: eval_loss
    report_to: none
    warmup_steps: 2000
  metric_for_subgoal_generator:
    _target_: carl.components.metrics.GeneratorMetricsHF

  # value
  value_function_trainer_class:
    _target_: hydra.utils.get_class
    path: transformers.Trainer
  value_function_trainer_args:
    _partial_: True
    _target_: transformers.TrainingArguments
    overwrite_output_dir: False
    evaluation_strategy: epoch
    per_device_train_batch_size: 256
    per_device_eval_batch_size: 256
    learning_rate: 0.0001
    weight_decay: 0.0001
    num_train_epochs: 2
    lr_scheduler_type: linear
    logging_strategy: epoch
    save_strategy: epoch
    save_total_limit: 1
    load_best_model_at_end: True
    metric_for_best_model: eval_loss
    report_to: none
    warmup_steps: 2000
  metric_for_value_function:
    _target_: carl.components.metrics.ValueMetricsHF
    type_of_evaluation: "regression"

  # cllp
  cllp_trainer_class:
    _target_: hydra.utils.get_class
    path: transformers.Trainer
  cllp_trainer_args:
    _partial_: True
    _target_: transformers.TrainingArguments
    overwrite_output_dir: False
    evaluation_strategy: epoch
    per_device_train_batch_size: 256
    per_device_eval_batch_size: 256
    learning_rate: 0.0001
    weight_decay: 0.0001
    num_train_epochs: 2
    lr_scheduler_type: linear
    logging_strategy: epoch
    save_strategy: epoch
    save_total_limit: 1
    load_best_model_at_end: True
    metric_for_best_model: eval_loss
    report_to: none
    warmup_steps: 2000
  metric_for_cllp:
    _target_: carl.components.metrics.ConditionalLowLevelPolicyMetricsHF

float32_matmul_precision: high
