# Experiment name: sokoban_train_policy
# Description: This experiments is part of experiments for testing hypothesis: Which algorithm is better - BFS or kSuB.
# Trajectories were generated by MCTS policy.

algorithm:
  _target_: carl.algorithms.train_supervised.TrainSupervisedHF
  custom_logger:
    _target_: carl.utils.loggers.NeptuneCaRLLogger
    name: "sokoban_train_policy_verification_num_of_trajectories_100"
    description: "sokoban_train_policy_verification_big_model_num_of_trajectories_100"
    project: "pmtest/subexit"
    tags: ["sokoban", "train_policy", "verification", "num_of_trajectories_100"]
    log_parameters: False
  datamodule:
    _target_: carl.dataloader.game_data_module.GameDataModule
    env:
      _target_: carl.environment.sokoban.env.SokobanEnv
      tokenizer:
        _target_: carl.environment.sokoban.tokenizer.SokobanTokenizer
        cut_distance: 150
        type_of_value_training: "regression"
        size_of_board:
          - 12
          - 12
      num_boxes: 4
    dataset_path: ""
    save_tokenized_dataset_path: ""
    training_goal: "policy"
    num_of_trajectories: None
    validation_split: 0.01
    num_workers: 1
  custom_metrics:
    _target_: carl.components.metrics.PolicyMetricsHF
  trainer:
    _partial_: True
    _target_: transformers.Trainer
    args:
      _target_: transformers.TrainingArguments
      output_dir: "models_weights/sokoban/policy"
      overwrite_output_dir: False
      evaluation_strategy: epoch
      per_device_train_batch_size: 512
      per_device_eval_batch_size: 512
      learning_rate: 0.0001
      weight_decay: 0.0001
      num_train_epochs: 10000
      lr_scheduler_type: linear
      log_level: info
      logging_strategy: epoch
      save_strategy: epoch
      save_total_limit: 1
      load_best_model_at_end: True
      metric_for_best_model: eval_loss
      warmup_steps: 0
      report_to: none
  model:
    _partial_: True
    _target_: transformers.BertForSequenceClassification
  config:
    _target_: transformers.BertConfig
    hidden_size: 128
    intermediate_size: 128
    max_position_embeddings: 128
    num_attention_heads: 1
    num_hidden_layers: 1
    vocab_size: 22
    num_labels: 4


  do_finetune: False
  path_to_model_weights: null


carl_grid:
  algorithm.config.hidden_size: [512]
  algorithm.config.intermediate_size: [2048]
  algorithm.config.max_position_embeddings: [1024]
  algorithm.config.num_attention_heads: [8]
  algorithm.config.num_hidden_layers: [8]
  algorithm.trainer.args.learning_rate: [1e-4]
  algorithm.trainer.args.weight_decay: [1e-4]
  algorithm.trainer.args.warmup_steps: [1000]

  algorithm.datamodule.num_of_trajectories: [50, 100, 200]
  algorithm.datamodule.dataset_path: ["/net/pr2/projects/plgrid/plggrl_algo/validation/sokoban/offline/12-12-4"]
  algorithm.datamodule.save_tokenized_dataset_path: ["/net/pr2/projects/plgrid/plggrl_algo/validation/sokoban/tokenized_offline/policy"]


