algorithm:
  _target_: carl.algorithms.solve_instances.SolveInstances

  # solver class
  solver_class:
    _target_: carl.solver.mcts.MCTS
    number_of_steps: 500
    number_of_simulations: 50
    discount: 1
    sampling_temperature: 0
    env:
      _target_: carl.environment.gym_rubik.rubik_env.RubikEnv
      tokenizer:
        _target_: carl.environment.gym_rubik.tokenizer.RubikCubeTokenizer
        cut_distance: 20
        type_of_value_training: "regression"

    value_function:
      _target_: carl.inference_components.mcts_value_wrapper.MCTSValueWrapper
      value:
        _target_: carl.inference_components.value.TransformerValue
        value_network:
          _target_: transformers.BertForSequenceClassification
          config:
            _target_: transformers.BertConfig
        path_to_value_network_weights: "/net/pr2/projects/plgrid/plggrl_algo/validation/rubik/components/moe_uniform/value/checkpoint-14504490"
        type_of_evaluation: "regression"
        noise_variance: 0
        env:
          _target_: carl.environment.gym_rubik.rubik_env.RubikEnv
          tokenizer:
            _target_: carl.environment.gym_rubik.tokenizer.RubikCubeTokenizer
            cut_distance: 20
            type_of_value_training: "regression"

    policy_state_builder:
      _target_: carl.mcts_states_builder.mcts_rubik_states_builder.StateBuilderRubik
      policy:
        _target_: carl.inference_components.policy.TransformerPolicy
        policy_network:
          _target_: transformers.BertForSequenceClassification
          config:
            _target_: transformers.BertConfig
        path_to_policy_weights: "/net/pr2/projects/plgrid/plggrl_algo/validation/rubik/components/actions_x100/policy/checkpoint-334001"
        env:
          _target_: carl.environment.gym_rubik.rubik_env.RubikEnv
          tokenizer:
            _target_: carl.environment.gym_rubik.tokenizer.RubikCubeTokenizer
            cut_distance: 20
            type_of_value_training: "regression"
        n_actions: 2
      env:
        _target_: carl.environment.gym_rubik.rubik_env.RubikEnv
        tokenizer:
          _target_: carl.environment.gym_rubik.tokenizer.RubikCubeTokenizer
          cut_distance: 20
          type_of_value_training: "regression"

  data_loader_class:
    _target_: carl.environment.instance_generator.BasicInstanceGenerator
    generator:
      _target_: carl.environment.instance_generator.GeneralIterableDataLoader
      path_to_folder_with_data: "/net/pr2/projects/plgrid/plggrl_algo/validation/rubik/progress/shuffle_general"
    batch_size: 100

  # result logger
  result_logger:
    _target_: carl.solve_instances.result_loggers.MCTSResultLogger
    custom_logger:
      _target_: carl.utils.loggers.NeptuneCaRLLogger
      name: "mcts_rubik_ICML_100x"
      description: "MCTS for rubik_100x"
      project: "pmtest/subexit"
      tags: "mcts_rubik_ICML 100x"
      log_parameters: False
    budget_logs: [1, 10, 20, 50, 60, 70, 80, 90, 100, 120, 140, 160, 180, 200, 250, 300, 350, 400, 450, 500, 600, 800, 1000, 2000, 2500, 3000, 4000, 5000]
    problem_to_solve: 500
  problem_to_solve: 500

  n_parallel_workers: 10

carl_workers:
  solve:
    algorithm._target_: carl.algorithms.solve_instances.SolveInstances

