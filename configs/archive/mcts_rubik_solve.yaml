carl_grid:
  algorithm.problem_to_solve: [500]
  algorithm.solver_class.number_of_steps: [200]
  algorithm.solver_class.number_of_simulations: [30]
  algorithm.solver_class.discount: [1]
  algorithm.solver_class.sampling_temperature: [0.5, 1.0]
  algorithm.solver_class.value_function.value.noise_variance: [0]
