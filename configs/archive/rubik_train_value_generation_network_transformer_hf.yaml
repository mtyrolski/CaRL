algorithm:
  _target_: carl.algorithms.train_supervised.TrainSupervisedHF
  custom_logger:
    _target_: carl.custom_logger.loggers.NeptuneCaRLLogger
    name: "rubik_value_generation_training_n_500k"
    description: "rubik_value_generation_training_n_500k"
    project: "pmtest/subexit"
    tags: "rubik_value_generation_training_n_500k"
    api_token: "eyJhcGlfYWRkcmVzcyI6Imh0dHBzOi8vYXBwLm5lcHR1bmUuYWkiLCJhcGlfdXJsIjoiaHR0cHM6Ly9hcHAubmVwdHVuZS5haSIsImFwaV9rZXkiOiJjMDEyZjc4MC0zZWRhLTQ3MWItYjMwMi1jN2Y2NDU4Y2Y5MDgifQ=="
    log_parameters: False
  datamodule:
    _target_: carl.dataloader.game_data_module.GameDataModule
    env:
      _target_: carl.environment.gym_rubik.rubik_env.RubikCubeEnv
      tokenizer:
        _target_: carl.environment.gym_rubik.tokenizer.RubikCubeTokenizer
        type_of_value_training: "generation"
        num_classes_generation: 21

    dataset_path: "/net/tscratch/people/plggracjangoral/rubik/offiline/shuffle_20/n_500000"
    save_tokenized_dataset_path: "/net/tscratch/people/plggracjangoral/rubik_training_data/offline/shuffle_20/n_500k_tokenized_value_generation"
    training_goal: "value_generation"
    validation_split: 0.1
    num_of_trajectories: 1000000
    num_workers: 1
  custom_metrics:
    _target_: carl.components.metrics.GeneratorMetricsHF
  trainer:
    _partial_: True
    _target_: transformers.Trainer
    args:
      _target_: transformers.TrainingArguments
      output_dir: "models_weights/rubik/value_generation"
      overwrite_output_dir: False
      evaluation_strategy: epoch
      per_device_train_batch_size: 2048
      per_device_eval_batch_size: 2048
      learning_rate: 0.0001
      weight_decay: 0.0001
      num_train_epochs: 100
      lr_scheduler_type: linear
      log_level: info
      logging_strategy: epoch
      save_strategy: epoch
      save_total_limit: 1
      load_best_model_at_end: True
      metric_for_best_model: eval_loss
      warmup_steps: 0
      report_to: none
  model:
    _partial_: True
    _target_: transformers.BartForConditionalGeneration
  config:
    _target_: transformers.BartConfig
    vocab_size: 34
    d_model: 128
    encoder_layers: 1
    decoder_layers: 1
    encoder_attention_heads: 1
    decoder_attention_heads: 1
    encoder_ffn_dim: 256
    decoder_ffn_dim: 256
    dropout: 0.1
    max_position_embeddings: 512

  do_finetune: False
  path_to_model_weights: null


carl_grid:
  algorithm.config.d_model: [512]
  algorithm.config.decoder_attention_heads: [4]
  algorithm.config.decoder_ffn_dim: [1024]
  algorithm.config.decoder_layers: [6]
  algorithm.config.encoder_attention_heads: [4]
  algorithm.config.encoder_ffn_dim: [512]
  algorithm.config.encoder_layers: [6]
  algorithm.config.dropout: [0.1]
  algorithm.config.max_position_embeddings: [512]
  algorithm.trainer.args.learning_rate: [5e-4, 1e-4]
  algorithm.trainer.args.weight_decay: [0.001]
  algorithm.trainer.args.warmup_steps: [2000]
