algorithm:

  # SolveInstances has parameters:
    #   - solver_class - this class is responsible for solving the problem. It has parameters:
    #           - max_nodes - maximum number of nodes to be expanded
    #           - planner_class - this class is responsible for planning the path
    #           - subgoal_generator - this class is responsible for generating subgoals
    #           - validator - this class is responsible for validating the plan, i.e. checking if there is a path from the initial state to the goal state
    #           - cllp - this class is responsible for executing the plan, i.e. executing the actions in the plan, i.e. finding the path from the initial state to the goal state
    #           - value_function - this class is responsible for evaluating the state, i.e. estimating the distance from the state to the solution
    #   - data_loader_class - this class is responsible for loading the data to be solved
    #   - result_logger - this class is responsible for logging the results
    #   - problem_to_solve - number of problems to be solved
    #   - n_parallel_workers - number of parallel workers, i.e. number of processes to be used


  _target_: carl.algorithms.solve_instances.SolveInstances

  # solver class
  solver_class:
    _target_: carl.solver.subgoal_search.Solver
    max_nodes: None
    planner_class:
      _partial_: true
      _target_: carl.solver.planners.BestFSPlanner

    # subgoal generator
    subgoal_generator:
      _target_: carl.inference_components.subgoal_generator.TransformerSubgoalGenerator
      generator:
        _target_: hydra.utils.get_class
        path: transformers.BartForConditionalGeneration

      path_to_generator_weights: ""
      env:
        _target_: carl.environment.sokoban.env.SokobanEnv
        tokenizer:
          _target_: carl.environment.sokoban.tokenizer.SokobanTokenizer
          cut_distance: None
          type_of_value_training: regression
          size_of_board:
            - 12
            - 12
          remove_border: False
        num_boxes: 4

      subgoal_generation_kwargs:
        max_new_tokens: 145
        do_sample: False
        temperature: 1.0
        num_beams: None
        num_return_sequences: None

    # validator
    validator:
      _target_: carl.inference_components.validator.BasicValidator
      env:
        _target_: carl.environment.sokoban.env.SokobanEnv
        tokenizer:
          _target_: carl.environment.sokoban.tokenizer.SokobanTokenizer
          cut_distance: None
          type_of_value_training: "regression"
          size_of_board:
            - 12
            - 12
        num_boxes: 4

      # conditional low level policy
      cllp:
        _target_: carl.inference_components.conditional_low_level_policy.TransformerConditionalLowLevelPolicy
        conditional_low_level_policy:
          _target_: hydra.utils.get_class
          path: transformers.BertForSequenceClassification

        path_to_conditional_low_level_policy_weights: ""
        env:
          _target_: carl.environment.sokoban.env.SokobanEnv
          tokenizer:
            _target_: carl.environment.sokoban.tokenizer.SokobanTokenizer
            cut_distance: None
            type_of_value_training: "regression"
            size_of_board:
              - 12
              - 12
          num_boxes: 4
      budget_for_achieving_subgoal: None

    # value function
    value_function:
      _target_: carl.inference_components.value.TransformerValue
      value_network:
        _target_: hydra.utils.get_class
        path: transformers.BertForSequenceClassification

      path_to_value_network_weights: ""
      type_of_evaluation: "regression"
      noise_variance: 0.0
      env:
        _target_: carl.environment.sokoban.env.SokobanEnv
        tokenizer:
          _target_: carl.environment.sokoban.tokenizer.SokobanTokenizer
          cut_distance: None
          type_of_value_training: "regression"
          size_of_board:
            - 12
            - 12
        num_boxes: 4

  # data loader class
  data_loader_class:
    _target_: carl.environment.instance_generator.BasicInstanceGenerator
    generator:
      _target_: carl.environment.instance_generator.GeneralIterableDataLoader
      path_to_folder_with_data: ""
    batch_size: 10

  # result logger
  result_logger:
    _target_: carl.utils.result_loggers.SubgoalSearchResultLogger
    custom_logger:
      _target_: carl.utils.loggers.NeptuneCaRLLogger
      name: None
      description: ""
      project: "pmtest/subexit"
      tags: None
      log_parameters: False
    problem_to_solve: 1000
    budget_logs: [50, 60, 70, 80, 90, 100, 120, 140, 160, 180, 200, 250, 300, 350, 400, 450, 500, 600, 800, 1000, 2000, 2500, 3000, 4000, 5000]
  problem_to_solve: 1000

  n_parallel_workers: 10

carl_grid:
  algorithm.solver_class.max_nodes: [2000]

  algorithm.solver_class.subgoal_generator.env.tokenizer.cut_distance: [150]
  algorithm.solver_class.subgoal_generator.subgoal_generation_kwargs.num_return_sequences: [2]
  algorithm.solver_class.subgoal_generator.subgoal_generation_kwargs.do_sample: [False]
  algorithm.solver_class.subgoal_generator.subgoal_generation_kwargs.temperature: [1.0]
  algorithm.solver_class.subgoal_generator.subgoal_generation_kwargs.num_beams: [8]


#  algorithm.solver_class.subgoal_generator.path_to_generator_weights: [""]
  algorithm.solver_class.subgoal_generator.path_to_generator_weights: ["/net/pr2/projects/plgrid/plggrl_algo/validation/sokoban/components/full_data/generator/border/4/checkpoint-75856"]
  algorithm.solver_class.validator.cllp.path_to_conditional_low_level_policy_weights: ["/net/pr2/projects/plgrid/plggrl_algo/validation/sokoban/components/full_data/cllp/8/checkpoint-167585"]
  algorithm.solver_class.value_function.path_to_value_network_weights: ["/net/pr2/projects/plgrid/plggrl_algo/validation/sokoban/components/full_data/value/checkpoint-1343100"]

  algorithm.data_loader_class.generator.path_to_folder_with_data: ["/net/pr2/projects/plgrid/plggrl_algo/validation/sokoban/progress/12_12_4"]

  algorithm.solver_class.validator.env.tokenizer.cut_distance: [150]
  algorithm.solver_class.validator.budget_for_achieving_subgoal: [10]

  algorithm.solver_class.value_function.env.tokenizer.cut_distance: [150]

  algorithm.result_logger.custom_logger.name: ["sokoban_subgoal_search"]
  algorithm.result_logger.custom_logger.tags: [["sokoban", "subgoal_search", "solve", "k_4"]]