algorithm:

  # SolveInstances has parameters:
    #   - solver_class - this class is responsible for solving the problem. It has parameters:
    #           - max_nodes - maximum number of nodes to be expanded
    #           - planner_class - this class is responsible for planning the path
    #           - subgoal_generator - this class is responsible for generating subgoals
    #           - validator - this class is responsible for validating the plan, i.e. checking if there is a path from the initial state to the goal state
    #           - cllp - this class is responsible for executing the plan, i.e. executing the actions in the plan, i.e. finding the path from the initial state to the goal state
    #           - value_function - this class is responsible for evaluating the state, i.e. estimating the distance from the state to the solution
    #   - data_loader_class - this class is responsible for loading the data to be solved
    #   - result_logger - this class is responsible for logging the results
    #   - problem_to_solve - number of problems to be solved
    #   - n_parallel_workers - number of parallel workers, i.e. number of processes to be used


  _target_: carl.algorithms.solve_instances.SolveInstances

  # solver class
  solver_class:
    _target_: carl.solver.subgoal_search.Solver
    max_nodes: 5000
    planner_class:
      _partial_: true
      _target_: carl.solver.planners.BestFSPlanner

    subgoal_generator:
      _target_: carl.inference_components.policy.PolicyGeneratorWrapper
#      policy:
#        _target_: carl.inference_components.policy.ExhaustiveBaselinePolicy
#        n_actions: 4
      policy:
        _target_: carl.inference_components.policy.TransformerPolicy
        policy_network:
          _target_: transformers.BertForSequenceClassification
          config:
            _target_: transformers.BertConfig
        path_to_policy_weights: "/mnt/storage_2/project_data/grant_619/eglmizaw/npuzzle/checkpoints/policy/n_40000/checkpoint-230748"
        env:
          _target_: carl.environment.n_puzzle.env.NPuzzleEnv
          tokenizer:
            _target_: carl.environment.n_puzzle.tokenizer.NPuzzleTokenizer
            cut_distance: null
            type_of_value_training: regression
            size_of_board:
              - 5
              - 5
        n_actions: 2
      env:
        _target_: carl.environment.n_puzzle.env.NPuzzleEnv
        tokenizer:
          _target_: carl.environment.n_puzzle.tokenizer.NPuzzleTokenizer
          cut_distance: null
          type_of_value_training: regression
          size_of_board:
            - 5
            - 5

    # validator
    validator:
      _target_: carl.inference_components.validator.DummyValidator
      env:
        _target_: carl.environment.n_puzzle.env.NPuzzleEnv
        tokenizer:
          _target_: carl.environment.n_puzzle.tokenizer.NPuzzleTokenizer
          cut_distance: null
          type_of_value_training: regression
          size_of_board:
            - 5
            - 5

    # value function
    value_function:
      _target_: carl.inference_components.value.TransformerValue
      value_network:
        _target_: transformers.BertForSequenceClassification
        config:
          _target_: transformers.BertConfig
      path_to_value_network_weights: "/mnt/storage_2/project_data/grant_619/eglmizaw/npuzzle/checkpoints/value/n_40000/checkpoint-4277"
      type_of_evaluation: "regression"
      env:
        _target_: carl.environment.n_puzzle.env.NPuzzleEnv
        tokenizer:
          _target_: carl.environment.n_puzzle.tokenizer.NPuzzleTokenizer
          cut_distance: null
          type_of_value_training: regression
          size_of_board:
            - 5
            - 5

  # data loader class
  data_loader_class:
    _target_: carl.environment.instance_generator.BasicInstanceGenerator
    generator:
      _target_: carl.environment.instance_generator.GeneralIterableDataLoader
      path_to_folder_with_data: "/mnt/storage_2/project_data/grant_619/eglmizaw/npuzzle/rl_loop_boards_to_solve"
#      path_to_folder_with_data: "/mnt/storage_2/project_data/grant_619/eglmizaw/npuzzle/eval_dataset/rl_loop/5x5"
    batch_size: 100

  # result logger
  result_logger:
    _target_: carl.utils.result_loggers.SubgoalSearchResultLogger
    custom_logger:
      _target_: carl.utils.loggers.NeptuneCaRLLogger
      name: "solve_instances"
      description: ""
      project: "pmtest/subexit"
      tags: "bestfs n_puzzle solve test"
      log_parameters: False
    budget_logs:
      - 100
      - 500
      - 1000
      - 5000

  problem_to_solve: 1000

  n_parallel_workers: 20

carl_grid:
  algorithm.problem_to_solve: [1000]
  algorithm.solver_class.subgoal_generator.policy.n_actions: [2, 3, 4]
  algorithm.data_loader_class.generator.path_to_folder_with_data: ["/mnt/storage_2/project_data/grant_619/eglmizaw/CaRL/n_puzzle_data/progress/5x5/shuffle_100"]

