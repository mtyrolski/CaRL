algorithm:
  _target_: carl.algorithms.train_supervised.TrainSupervisedHF
  custom_logger:
    _target_: carl.utils.loggers.NeptuneCaRLLogger
    name: "rubik_policy_generator_training_n_500k"
    description: "rubik_policy_generator_training_n_500k"
    project: "pmtest/subexit"
    tags: ["rubik", "policy_generator", "training", "n_500k"]
    log_parameters: False
  datamodule:
    _target_: carl.dataloader.game_data_module.GameDataModule
    env:
      _target_: carl.environment.gym_rubik.rubik_env.RubikEnv
      tokenizer:
        _target_: carl.environment.gym_rubik.tokenizer.RubikCubeTokenizer
        cut_distance: 20
        type_of_value_training: "regression"

    dataset_path: ""
    save_tokenized_dataset_path: ""
    training_goal: "policy_generation"
    subgoal_distance_interval: [ 1 ]
    validation_split: 0.1
    num_of_trajectories: 500000
    num_workers: 1

  custom_metrics:
    _target_: carl.components.metrics.GeneratorMetricsHF
  trainer:
    _partial_: True
    _target_: transformers.Trainer
    args:
      _target_: transformers.TrainingArguments
      output_dir: "models_weights/rubik/policy_generation"
      overwrite_output_dir: False
      evaluation_strategy: epoch
      per_device_train_batch_size: 2048
      per_device_eval_batch_size: 2048
      learning_rate: 0.0001
      weight_decay: 0.0001
      num_train_epochs: 1000
      lr_scheduler_type: linear
      log_level: info
      logging_strategy: epoch
      save_strategy: epoch
      save_total_limit: 50
      warmup_steps: 0
      report_to: none
  model:
    _partial_: True
    _target_: transformers.BartForConditionalGeneration
  config:
    _target_: transformers.BartConfig
    vocab_size: 40
    d_model: 128
    encoder_layers: 1
    decoder_layers: 1
    encoder_attention_heads: 1
    decoder_attention_heads: 1
    encoder_ffn_dim: 256
    decoder_ffn_dim: 256
    dropout: 0.1
    max_position_embeddings: 512

  do_finetune: False
  path_to_model_weights: null


carl_grid:
  algorithm.config.d_model: [512]
  algorithm.config.decoder_attention_heads: [2]
  algorithm.config.decoder_ffn_dim: [256]
  algorithm.config.decoder_layers: [3]
  algorithm.config.encoder_attention_heads: [2]
  algorithm.config.encoder_ffn_dim: [256]
  algorithm.config.encoder_layers: [3]
  algorithm.config.dropout: [0.1, 0.3]
  algorithm.config.max_position_embeddings: [512]
  algorithm.trainer.args.learning_rate: [1e-4]
  algorithm.trainer.args.weight_decay: [0.001]
  algorithm.trainer.args.warmup_steps: [2000]

  # Here you specify the path to dataset.
  algorithm.datamodule.dataset_path: ["/net/pr2/projects/plgrid/plggrl_algo/validation/rubik/offiline/shuffle_20"]

  # Here you specify the path to tokenized dataset. This is place where the tokenized dataset will be saved.
  algorithm.datamodule.save_tokenized_dataset_path: ["/net/pr2/projects/plgrid/plggrl_algo/validation/rubik/tokenized_offline/generator_shuffle_20"]
