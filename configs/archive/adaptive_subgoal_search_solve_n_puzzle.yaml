algorithm:

  _target_: carl.algorithms.solve_instances.SolveInstances
  n_jobs: 36
  dump_solved: False

  # solver class
  solver:
    _target_: carl.solver.subgoal_search.Solver
    # _target_: carl.solver.subgoal_search_batched.SubgoalSearchSolver # Comment this for the non-batched version
    # inference_batch_size: 384 # Comment this for the non-batched version
    max_nodes: 5000
    planner_class:
      _partial_: true
      _target_: carl.solver.planners.AdasubsPlanner
      prune_search_trees: True
      generators_k_list: [1]

    # subgoal generator
    subgoal_generator:
      _target_: carl.inference_components.subgoal_generator.AdaptiveSubgoalGenerator
      env:
        _target_: carl.environment.n_puzzle.env.NPuzzleEnv
        tokenizer:
          _target_: carl.environment.n_puzzle.tokenizer.NPuzzleTokenizer
          cut_distance: null
          type_of_value_training: regression
          size_of_board:
            - 5
            - 5
      subgoal_generation_kwargs:
        max_new_tokens: 26
        num_beams: 8
        num_return_sequences: 2
      generator_k_list: [1]
      paths_to_generator_weights:
        - "./rlloop_icml/n_puzzle/components/n_500/generator/1"
      subgoal_generator_class:
        _target_: carl.inference_components.subgoal_generator.TransformerSubgoalGenerator
        _partial_: True
        generator_class:
          _target_: transformers.BartForConditionalGeneration.from_pretrained
          _partial_: True
        training_module: null
    # validator
    validator:
      _target_: carl.inference_components.validator.BasicValidator
      inference_batch_size: 1
      env_class:
        _target_: carl.environment.n_puzzle.env.NPuzzleEnv
        tokenizer:
          _target_: carl.environment.n_puzzle.tokenizer.NPuzzleTokenizer
          cut_distance: null
          type_of_value_training: regression
          size_of_board:
            - 5
            - 5
        _partial_: True

      # conditional low level policy
      cllp:
        _target_: carl.inference_components.conditional_low_level_policy.TransformerConditionalLowLevelPolicy
        conditional_low_level_policy_class:
          _target_: transformers.BertForSequenceClassification.from_pretrained
          _partial_: True
        path_to_conditional_low_level_policy_weights: "./rlloop_icml/n_puzzle/components/n_500/cllp/1"
        env:
          _target_: carl.environment.n_puzzle.env.NPuzzleEnv
          tokenizer:
            _target_: carl.environment.n_puzzle.tokenizer.NPuzzleTokenizer
            cut_distance: null
            type_of_value_training: regression
            size_of_board:
              - 5
              - 5
        training_module: null

    # value function
    value_function:
      _target_: carl.inference_components.value.TransformerValue
      value_network_class:
        _target_: transformers.BertForSequenceClassification.from_pretrained
        _partial_: True
      path_to_value_network_weights: "./rlloop_icml/n_puzzle/components/n_500/value"
      type_of_evaluation: "regression"
      env:
        _target_: carl.environment.n_puzzle.env.NPuzzleEnv
        tokenizer:
          _target_: carl.environment.n_puzzle.tokenizer.NPuzzleTokenizer
          cut_distance: null
          type_of_value_training: regression
          size_of_board:
            - 5
            - 5
      training_module: null
  # data loader class
  data_loader:
    _target_: carl.environment.instance_generator.BasicInstanceGenerator
    generator:
      _target_: carl.environment.instance_generator.GeneralIterableDataLoader
      path_to_folder_with_data: "./rlloop_icml/n_puzzle/online_data"
    batch_size: 1

  # result logger
  result_logger:
    _target_: carl.solve_instances.result_loggers.SubgoalSearchResultLogger
    custom_logger:
      _target_: carl.custom_logger.loggers.NeptuneCaRLLogger
      name: ""
      description: ""
      project: "pmtest/subexit"
      tags:
        - "solve n_puzzle - dev - benchmark"
      log_parameters: True
    budget_logs:
      - 100
      - 200
      - 300
      - 500
      - 1000
      - 2000
      - 3000
      - 5000

  problems_to_solve: 1000


carl_workers:
  solve:
    algorithm._target_: carl.algorithms.solve_instances.SolveInstances


carl_grid:
  - algorithm.solver.max_nodes: [5000]
    algorithm.solver.subgoal_generator.paths_to_generator_weights: [["./rlloop_icml/n_puzzle/components/n_500/generator/1"]]
    algorithm.solver.validator.cllp.path_to_conditional_low_level_policy_weights: ["./rlloop_icml/n_puzzle/components/n_500/cllp/1"]
    algorithm.solver.value_function.path_to_value_network_weights: ["./rlloop_icml/n_puzzle/components/n_500/value"]
  - algorithm.solver.max_nodes: [5000]
    algorithm.solver.subgoal_generator.paths_to_generator_weights: [["./rlloop_icml/n_puzzle/components/n_200/generator/1"]]
    algorithm.solver.validator.cllp.path_to_conditional_low_level_policy_weights: ["./rlloop_icml/n_puzzle/components/n_200/cllp/1"]
    algorithm.solver.value_function.path_to_value_network_weights: ["./rlloop_icml/n_puzzle/components/n_200/value"]
