    tags: "baseline_policy n_puzzle train paper_experiments n_40000"
    api_token: "eyJhcGlfYWRkcmVzcyI6Imh0dHBzOi8vYXBwLm5lcHR1bmUuYWkiLCJhcGlfdXJsIjoiaHR0cHM6Ly9hcHAubmVwdHVuZS5haSIsImFwaV9rZXkiOiJlMTg1NjhmYy1jMzM3LTQ4NDQtODEwMC03ZDkyNjVkNTQ1ZjAifQ=="
    log_parameters: False
  datamodule:
    _target_: carl.dataloader.game_data_module.GameDataModule
    env:
      _target_: carl.environment.n_puzzle.env.NPuzzleEnv
      tokenizer:
        _target_: carl.environment.n_puzzle.tokenizer.NPuzzleTokenizer
        cut_distance: null
        type_of_value_training: regression
        size_of_board:
          - 5
          - 5
    dataset_path: "/net/tscratch/people/plggracjangoral/n_puzzle/training_datasets/5x5/n_40000"
    save_tokenized_dataset_path: "/net/tscratch/people/plgmizaw/project_data/npuzzle/5x5_tokenized_data_baseline_policy"
    training_goal: policy
    num_of_trajectories: 100
    trajectory_length: null
    validation_split: 0.1
    num_workers: 1
  trainer:
    _partial_: True
    _target_: transformers.Trainer
    args:
      _target_: transformers.TrainingArguments
      output_dir: "models_weights/n_puzzle/baseline_policy"
      overwrite_output_dir: True
      evaluation_strategy: epoch
      per_device_train_batch_size: 512
      per_device_eval_batch_size: 512
      learning_rate: 0.0001
      weight_decay: 0.0001
      num_train_epochs: 100
      lr_scheduler_type: linear
      log_level: info
      logging_strategy: epoch
      save_strategy: epoch
      save_total_limit: 1
      load_best_model_at_end: True
      metric_for_best_model: eval_loss
      warmup_steps: 1000
      report_to: none
  model:
