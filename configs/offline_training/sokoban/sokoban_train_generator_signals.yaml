# Experiment name: sokoban_train_generator_signals
# Compare generator training signal sources and target modes.

args:
  env:
    _target_: carl.environment.sokoban.env.SokobanEnv
    tokenizer:
      _target_: carl.environment.sokoban.tokenizer.SokobanTokenizer
      cut_distance: 150
      type_of_value_training: regression
      size_of_board:
        - 12
        - 12
      remove_border: False
    num_boxes: 4
  generator_checkpoint: "./rl-data/validation/sokoban/components/full_data/generator/border/8/checkpoint-75856"

batch_size: 32

algorithm:
  _target_: carl.algorithms.train_supervised.TrainSupervisedHF
  custom_logger:
    _target_: carl.utils.loggers.NeptuneCaRLLogger
    name: "sokoban_train_generator_signals"
    description: "sokoban_train_generator_signals"
    project: "pmtest/subexit"
    tags: ["sokoban", "train_generator", "signals", "12_12_4"]
    log_parameters: False
  datamodule:
    _target_: carl.dataloader.game_data_module.GameDataModule
    env: ${args.env}
    dataset_path: "./rl-data/validation/sokoban/offline/12-12-4"
    save_tokenized_dataset_path: "./validation/sokoban/tokenized_offline/generator_signals"
    training_goal: "generator"
    num_of_trajectories: 1000
    subgoal_distance_interval: [8]
    validation_split: 0.1
    num_workers: 1
    experiences_path: "./solve_attempts"
    experiences_glob: "solved_problems_*_12x12x4_batch_*.joblib"
    generator_target_mode: "sliding_window"
    generator_k: 8
    generator_offsets: [-1, 1]
  custom_metrics:
    _target_: carl.utils.training_metrics.GeneratorMetricsHF
  trainer:
    _partial_: True
    _target_: transformers.Trainer
    args:
      _target_: transformers.TrainingArguments
      output_dir: "models_weights/sokoban/generator/signals"
      overwrite_output_dir: False
      eval_strategy: epoch
      per_device_train_batch_size: ${batch_size}
      per_device_eval_batch_size: ${batch_size}
      learning_rate: 1e-4
      weight_decay: 0.0001
      num_train_epochs: 10000
      lr_scheduler_type: linear
      log_level: info
      logging_strategy: epoch
      save_strategy: epoch
      save_total_limit: 1
      load_best_model_at_end: True
      metric_for_best_model: eval_loss
      report_to: none
      warmup_steps: 1000
  model:
    _partial_: True
    _target_: transformers.BartForConditionalGeneration
  config:
    _target_: transformers.BartConfig
    vocab_size: 22
    d_model: 256
    encoder_layers: 3
    decoder_layers: 3
    encoder_attention_heads: 4
    decoder_attention_heads: 4
    encoder_ffn_dim: 2048
    decoder_ffn_dim: 1024
    dropout: 0.1
    max_position_embeddings: 256

  do_finetune: False
  path_to_model_weights: "${args.generator_checkpoint}"

float32_matmul_precision: high

carl_grid:
  - algorithm.custom_logger.name: ["sokoban_train_generator_dataset_k8"]
    algorithm.custom_logger.description: ["generator dataset sliding window k8"]
    algorithm.custom_logger.tags: [["sokoban", "train_generator", "dataset", "sliding_window", "k8", "12_12_4", "scratch"]]
    algorithm.do_finetune: [False]
    algorithm.path_to_model_weights: ["null"]
    algorithm.datamodule.experiences_path: ["null"]
    algorithm.datamodule.generator_target_mode: ["sliding_window"]
    algorithm.datamodule.subgoal_distance_interval: [[8]]
    algorithm.datamodule.save_tokenized_dataset_path: ["./validation/sokoban/tokenized_offline/generator_signals/dataset_sliding_k8"]
    algorithm.trainer.args.output_dir: ["models_weights/sokoban/generator/dataset_sliding_k8"]
  - algorithm.custom_logger.name: ["sokoban_train_generator_dataset_k8_finetune"]
    algorithm.custom_logger.description: ["generator dataset sliding window k8 finetune"]
    algorithm.custom_logger.tags: [["sokoban", "train_generator", "dataset", "sliding_window", "k8", "12_12_4", "finetune"]]
    algorithm.do_finetune: [True]
    algorithm.path_to_model_weights: ["${args.generator_checkpoint}"]
    algorithm.datamodule.experiences_path: ["null"]
    algorithm.datamodule.generator_target_mode: ["sliding_window"]
    algorithm.datamodule.subgoal_distance_interval: [[8]]
    algorithm.datamodule.save_tokenized_dataset_path: ["./validation/sokoban/tokenized_offline/generator_signals/dataset_sliding_k8"]
    algorithm.trainer.args.output_dir: ["models_weights/sokoban/generator/dataset_sliding_k8_finetune"]
  - algorithm.custom_logger.name: ["sokoban_train_generator_exp_all_pairs"]
    algorithm.custom_logger.description: ["generator experience sliding window all pairs"]
    algorithm.custom_logger.tags: [["sokoban", "train_generator", "experience", "sliding_window", "all_pairs", "12_12_4", "scratch"]]
    algorithm.do_finetune: [False]
    algorithm.path_to_model_weights: ["null"]
    algorithm.datamodule.dataset_path: ["null"]
    algorithm.datamodule.experiences_path: ["./solve_attempts"]
    algorithm.datamodule.generator_target_mode: ["sliding_window"]
    algorithm.datamodule.subgoal_distance_interval: ["null"]
    algorithm.datamodule.save_tokenized_dataset_path: ["./validation/sokoban/tokenized_offline/generator_signals/exp_sliding_all_pairs"]
    algorithm.trainer.args.output_dir: ["models_weights/sokoban/generator/exp_sliding_all_pairs"]
  - algorithm.custom_logger.name: ["sokoban_train_generator_exp_all_pairs_finetune"]
    algorithm.custom_logger.description: ["generator experience sliding window all pairs finetune"]
    algorithm.custom_logger.tags: [["sokoban", "train_generator", "experience", "sliding_window", "all_pairs", "12_12_4", "finetune"]]
    algorithm.do_finetune: [True]
    algorithm.path_to_model_weights: ["${args.generator_checkpoint}"]
    algorithm.datamodule.dataset_path: ["null"]
    algorithm.datamodule.experiences_path: ["./solve_attempts"]
    algorithm.datamodule.generator_target_mode: ["sliding_window"]
    algorithm.datamodule.subgoal_distance_interval: ["null"]
    algorithm.datamodule.save_tokenized_dataset_path: ["./validation/sokoban/tokenized_offline/generator_signals/exp_sliding_all_pairs"]
    algorithm.trainer.args.output_dir: ["models_weights/sokoban/generator/exp_sliding_all_pairs_finetune"]
  - algorithm.custom_logger.name: ["sokoban_train_generator_exp_k_offsets_k8"]
    algorithm.custom_logger.description: ["generator experience k_offsets k8"]
    algorithm.custom_logger.tags: [["sokoban", "train_generator", "experience", "k_offsets", "k8", "12_12_4", "scratch"]]
    algorithm.do_finetune: [False]
    algorithm.path_to_model_weights: ["null"]
    algorithm.datamodule.dataset_path: ["null"]
    algorithm.datamodule.experiences_path: ["./solve_attempts"]
    algorithm.datamodule.generator_target_mode: ["k_offsets"]
    algorithm.datamodule.generator_k: [8]
    algorithm.datamodule.generator_offsets: [[-1, 1]]
    algorithm.datamodule.save_tokenized_dataset_path: ["./validation/sokoban/tokenized_offline/generator_signals/exp_k_offsets_k8"]
    algorithm.trainer.args.output_dir: ["models_weights/sokoban/generator/exp_k_offsets_k8"]
  - algorithm.custom_logger.name: ["sokoban_train_generator_exp_k_offsets_k8_finetune"]
