# Experiment name: sokoban_train_generator
# Trajectories were generated by MCTS agent.

# K-SubgoalGenerator - k8 - 12_12_4

args:
  env:
    _target_: carl.environment.sokoban.env.SokobanEnv
    tokenizer:
      _target_: carl.environment.sokoban.tokenizer.SokobanTokenizer
      cut_distance: 150
      type_of_value_training: regression
      size_of_board:
        - 12
        - 12
      remove_border: False
    num_boxes: 4

batch_size: 32

algorithm:
  _target_: carl.algorithms.train_supervised.TrainSupervisedHF
  custom_logger:
    _target_: carl.utils.loggers.NeptuneCaRLLogger
    name: "sokoban_train_generator"
    description: "sokoban_train_generator"
    project: "pmtest/subexit"
    tags: ["sokoban", "train_generator", "12_12_4"]
    log_parameters: False
  datamodule:
    _target_: carl.dataloader.game_data_module.GameDataModule
    env: ${args.env}
    dataset_path: "./validation/sokoban/offline/12-12-4"
    save_tokenized_dataset_path: "./validation/sokoban/tokenized_offline/generator"
    training_goal: "generator"
    num_of_trajectories: 1000
    subgoal_distance_interval: [8]
    validation_split: 0.1
    num_workers: 1
  custom_metrics:
    _target_: carl.components.metrics.GeneratorMetricsHF
  trainer:
    _partial_: True
    _target_: transformers.Trainer
    args:
      _target_: transformers.TrainingArguments
      output_dir: "models_weights/sokoban/generator"
      overwrite_output_dir: False
      eval_strategy: epoch
      per_device_train_batch_size: ${batch_size}
      per_device_eval_batch_size: ${batch_size}
      learning_rate: 1e-4
      weight_decay: 0.0001
      num_train_epochs: 10000
      lr_scheduler_type: linear
      log_level: info
      logging_strategy: epoch
      save_strategy: epoch
      save_total_limit: 1
      load_best_model_at_end: True
      metric_for_best_model: eval_loss
      report_to: none
      warmup_steps: 1000
  model:
    _partial_: True
    _target_: transformers.BartForConditionalGeneration
  config:
    _target_: transformers.BartConfig
    vocab_size: 22
    d_model: 256
    encoder_layers: 3
    decoder_layers: 3
    encoder_attention_heads: 4
    decoder_attention_heads: 4
    encoder_ffn_dim: 2048
    decoder_ffn_dim: 1024
    dropout: 0.1
    max_position_embeddings: 256

  do_finetune: False
  path_to_model_weights: null

# Other config
float32_matmul_precision: high



carl_grid:
