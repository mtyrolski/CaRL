args:
  env:
    _target_: carl.environment.sokoban.env.SokobanEnv
    tokenizer:
      _target_: carl.environment.sokoban.tokenizer.SokobanTokenizer
      cut_distance: 150
      type_of_value_training: regression
      size_of_board:
        - 12
        - 12
      remove_border: False
    num_boxes: 4
  init_checkpoint: "./rl-data/validation/sokoban/components/full_data/generator/border/8/checkpoint-75856"
  teacher_dataset: "./rl-data/validation/sokoban/universal_teacher/sokoban_12x12x4_teacher_annotations.joblib"

batch_size: 32

algorithm:
  _target_: carl.algorithms.train_universal_generator.TrainUniversalGeneratorHF
  recipe: "finetune"
  custom_logger: null
  output_dir: "models_weights/sokoban/universal_generator/finetune"
  datamodule:
    _target_: carl.dataloader.universal_generator_data_module.UniversalGeneratorDataModule
    env: ${args.env}
    recipe: "finetune"
    save_tokenized_dataset_path: "./validation/sokoban/tokenized_offline/universal_generator/finetune"
    teacher_dataset_path: ${args.teacher_dataset}
    validation_split: 0.1
    batch_size: ${batch_size}
    num_workers: 0
    teacher_accept_only: True
    teacher_reached_only: False
    max_samples: 200000
  model:
    _target_: transformers.BartForConditionalGeneration.from_pretrained
    _partial_: true
  config: null
  do_finetune: True
  path_to_model_weights: ${args.init_checkpoint}
  learning_rate: 1e-4
  weight_decay: 0.0001
  max_steps: 1000
  num_train_epochs: 3
  eval_every_n_steps: 100
  log_every_n_steps: 20
  save_every_n_steps: 200
  grad_clip_norm: 1.0
  temperature: 0.1
  lambda_raw: 0.0
  lambda_imit: 1.0
  lambda_contrastive: 0.0
  lambda_verifier: 0.0

float32_matmul_precision: high

carl_workers:
  solve:
    algorithm._target_: carl.algorithms.train_universal_generator.TrainUniversalGeneratorHF

carl_grid:
  - {}
