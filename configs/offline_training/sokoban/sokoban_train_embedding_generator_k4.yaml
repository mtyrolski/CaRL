# Experiment name: sokoban_train_embedding_generator_k4
# Description: Train embedding generator for k=4 step subgoals in latent space
# This enables hierarchical planning with 4-step lookahead in embedding space

args:
  env:
    _target_: carl.environment.sokoban.env.SokobanEnv
    tokenizer:
      _target_: carl.environment.sokoban.tokenizer.SokobanTokenizer
      cut_distance: 150
      type_of_value_training: regression
      size_of_board:
        - 12
        - 12
      remove_border: False
    num_boxes: 4

batch_size: 32

algorithm:
  _target_: carl.algorithms.train_supervised.TrainSupervisedHF
  custom_logger:
    _target_: carl.utils.loggers.NeptuneCaRLLogger
    name: "sokoban_train_embedding_generator_k4"
    description: "Training embedding generator for 4-step subgoals in Sokoban"
    project: "pmtest/subexit"
    tags: ["sokoban", "embedding_generator", "k4", "12_12_4"]
    log_parameters: False
  datamodule:
    _target_: carl.dataloader.game_data_module.GameDataModule
    env: ${args.env}
    dataset_path: "./validation/sokoban/offline/12-12-4"
    save_tokenized_dataset_path: "./validation/sokoban/tokenized_offline/embedding_generator_k4"
    training_goal: "embedding_generator"
    subgoal_distance_interval: [4]
    num_of_trajectories: 1000
    validation_split: 0.1
    num_workers: 4
  custom_metrics:
    _target_: carl.components.metrics.EmbeddingGeneratorMetricsHF
  trainer:
    _partial_: True
    _target_: transformers.Trainer
    args:
      _target_: transformers.TrainingArguments
      output_dir: "models_weights/sokoban/embedding_generator/k4"
      overwrite_output_dir: False
      eval_strategy: epoch
      per_device_train_batch_size: ${batch_size}
      per_device_eval_batch_size: ${batch_size}
      learning_rate: 1e-4
      weight_decay: 0.0001
      num_train_epochs: 200
      lr_scheduler_type: cosine_with_restarts
      log_level: info
      logging_strategy: epoch
      save_strategy: epoch
      save_total_limit: 3
      load_best_model_at_end: True
      metric_for_best_model: eval_embedding_cosine_similarity
      greater_is_better: True
      report_to: none
      warmup_steps: 1000
      dataloader_num_workers: 4
  model:
    _partial_: True
    _target_: carl.components.embedding_generator.EmbeddingGenerator
    embedding_dim: 64  # Must match autoencoder embedding dimension
    hidden_dims: [512, 256]
    k_steps: 4
    dropout: 0.1
    use_attention: True
  config: null  # Not using HuggingFace config for custom PyTorch model
  
  do_finetune: False
  path_to_model_weights: null
  # Path to pretrained state embedding model (AE or VAE)
  state_embedding_weights: "./models_weights/sokoban/state_embedding_ae/checkpoint-best"

# Other config
float32_matmul_precision: high

carl_grid: