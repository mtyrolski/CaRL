# Experiment name: sokoban_train_state_embedding_vae
# Description: Train HuggingFace BERT-based VAE for state embeddings in Sokoban domain
# This enables regularized hierarchical latent space search with uncertainty modeling

args:
  env:
    _target_: carl.environment.sokoban.env.SokobanEnv
    tokenizer:
      _target_: carl.environment.sokoban.tokenizer.SokobanTokenizer
      cut_distance: 150
      type_of_value_training: regression
      size_of_board:
        - 12
        - 12
      remove_border: False
    num_boxes: 4

batch_size: 64

algorithm:
  _target_: carl.algorithms.train_supervised.TrainSupervisedHF
  custom_logger:
    _target_: carl.utils.loggers.NeptuneCaRLLogger
    name: "sokoban_train_state_embedding_vae"
    description: "Training HuggingFace BERT-based VAE for Sokoban state embeddings"
    project: "pmtest/subexit"
    tags: ["sokoban", "vae", "state_embedding", "12_12_4", "huggingface"]
    log_parameters: False
  datamodule:
    _target_: carl.dataloader.game_data_module.GameDataModule
    env: ${args.env}
    dataset_path: "./validation/sokoban/offline/12-12-4"
    save_tokenized_dataset_path: "./validation/sokoban/tokenized_offline/state_embedding_vae"
    training_goal: "state_embedding_vae"
    num_of_trajectories: 1000
    validation_split: 0.1
    num_workers: 4
  custom_metrics:
    _target_: carl.components.metrics.StateEmbeddingVAEMetricsHF
  trainer:
    _partial_: True
    _target_: transformers.Trainer
    args:
      _target_: transformers.TrainingArguments
      output_dir: "models_weights/sokoban/state_embedding_vae" 
      overwrite_output_dir: False
      eval_strategy: epoch
      per_device_train_batch_size: ${batch_size}
      per_device_eval_batch_size: ${batch_size}
      learning_rate: 1e-4
      weight_decay: 0.001
      num_train_epochs: 150
      lr_scheduler_type: cosine
      log_level: info
      logging_strategy: epoch
      save_strategy: epoch
      save_total_limit: 3
      load_best_model_at_end: True
      metric_for_best_model: eval_loss
      greater_is_better: False
      report_to: none
      warmup_steps: 500
      dataloader_num_workers: 4
  model:
    _partial_: True
    _target_: carl.components.state_embeddings.HFStateVAE
  config:
    _target_: carl.components.state_embeddings.StateEmbeddingConfig
    vocab_size: 144  # 12x12 board flattened
    hidden_size: 512
    num_hidden_layers: 6
    num_attention_heads: 8
    intermediate_size: 2048
    hidden_dropout_prob: 0.1
    latent_dim: 64
    beta: 1.0  # KL divergence weight
  
  do_finetune: False
  path_to_model_weights: null

# Other config
float32_matmul_precision: high

carl_grid: