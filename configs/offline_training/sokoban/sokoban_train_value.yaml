# Experiment name: sokoban_train_policy
# Description: This experiments is part of experiments for testing hypothesis: Which algorithm is better - BFS or kSuB.
# Trajectories were generated by MCTS policy.

args:
  env:
    _target_: carl.environment.sokoban.env.SokobanEnv
    tokenizer:
      _target_: carl.environment.sokoban.tokenizer.SokobanTokenizer
      cut_distance: 150
      type_of_value_training: regression
      size_of_board:
        - 12
        - 12
      remove_border: False
    num_boxes: 4

batch_size: 32

algorithm:
  _target_: carl.algorithms.train_supervised.TrainSupervisedHF
  custom_logger:
    _target_: carl.utils.loggers.NeptuneCaRLLogger
    name: "sokoban_train_value"
    description: "sokoban_train_value"
    project: "pmtest/subexit"
    tags: ["sokoban", "train_value", "12_12_4"]
    log_parameters: False
  datamodule:
    _target_: carl.dataloader.game_data_module.GameDataModule
    env: ${args.env}
    dataset_path: "./validation/sokoban/offline/12-12-4"
    save_tokenized_dataset_path: "./validation/sokoban/tokenized_offline/value"
    training_goal: "value"
    num_of_trajectories: 50 # None - for all trajectories
    validation_split: 0.01
    num_workers: 1
  custom_metrics:
    _target_: carl.components.metrics.PolicyMetricsHF
  trainer:
    _partial_: True
    _target_: transformers.Trainer
    args:
      _target_: transformers.TrainingArguments
      output_dir: "models_weights/sokoban/value"
      overwrite_output_dir: False
      evaluation_strategy: epoch
      per_device_train_batch_size: 2048
      per_device_eval_batch_size: 2048
      learning_rate: 0.0001
      weight_decay: 0.0001
      num_train_epochs: 10000
      lr_scheduler_type: linear
      log_level: info
      logging_strategy: epoch
      save_strategy: epoch
      save_total_limit: 1
      load_best_model_at_end: True
      metric_for_best_model: eval_loss
      warmup_steps: 0
      report_to: none
  model:
    _partial_: True
    _target_: transformers.BertForSequenceClassification
  config:
    _target_: transformers.BertConfig
    hidden_size: 128
    intermediate_size: 128
    max_position_embeddings: 256
    num_attention_heads: 2
    num_hidden_layers: 1
    vocab_size: 22
    num_labels: 1


  do_finetune: False
  path_to_model_weights: null


carl_grid:
