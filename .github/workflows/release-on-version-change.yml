name: Release On Version Change

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-on-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Resolve version from pyproject.toml
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import sys
          import tomllib
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          data = tomllib.loads(pyproject.read_text(encoding="utf-8"))

          project_version = (data.get("project") or {}).get("version")
          poetry_version = ((data.get("tool") or {}).get("poetry") or {}).get("version")

          version = project_version or poetry_version
          if not version:
              print("::error::No version found in [project].version or [tool.poetry].version")
              sys.exit(1)

          if project_version and poetry_version and project_version != poetry_version:
              print(
                  "::warning::Version mismatch in pyproject.toml: "
                  f"[project].version={project_version} vs [tool.poetry].version={poetry_version}. "
                  "Using [project].version for release tagging."
              )

          tag = f"v{version}"
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as fh:
              fh.write(f"version={version}\n")
              fh.write(f"tag={tag}\n")
          print(f"Resolved release version: {version} ({tag})")
          PY

      - name: Check whether tag already exists
        id: tag_check
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag already exists: $TAG. Skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag does not exist yet: $TAG. Release will be created."
          fi

      - name: Create and push git tag
        if: steps.tag_check.outputs.exists == 'false'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CaRL ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
