name: PR checks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.21"
          enable-cache: false
      - name: Install locked environment
        run: |
          uv python install 3.11.4
          uv sync --locked --no-default-groups --extra icl --python 3.11.4
      - name: Regression suite
        run: make test UV_RUN='uv run --locked --offline --no-sync'
      - name: Offline quick start
        run: |
          work="$RUNNER_TEMP/carl-pr-smoke"
          uv run --locked --offline --no-sync python -m scripts.run_icl_smoke \
            --config configs/icl/quickstart/sokoban_sweep.json --output "$work/sokoban"
          uv run --locked --offline --no-sync python -m scripts.evaluate_icl \
            --matched "$work/sokoban/sweep.json" --output "$work/report"
