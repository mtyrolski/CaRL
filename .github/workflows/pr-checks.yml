name: PR checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.21"
          enable-cache: false
      - name: Install locked environment
        run: |
          uv python install 3.11.4
          uv sync --locked --no-default-groups --group lint --extra icl --python 3.11.4
      - name: Static checks
        run: make -j2 ruff mypy UV_LINT_RUN='uv run --locked --offline --no-sync'
      - name: Regression suite
        run: make test UV_RUN='uv run --locked --offline --no-sync'
      - name: Offline quick start
        run: |
          work="$RUNNER_TEMP/carl-pr-smoke"
          uv run --locked --offline --no-sync python -m scripts.run_icl_smoke \
            --config configs/icl/quickstart/sokoban_sweep.json --output "$work/sokoban"
          uv run --locked --offline --no-sync python -m scripts.evaluate_icl \
            --matched "$work/sokoban/sweep.json" --output "$work/report"

  package:
    needs: cpu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.21"
          enable-cache: false
      - name: Build wheel and source distribution
        run: |
          uv python install 3.11.4
          uv build --no-sources --python 3.11.4 --out-dir "$RUNNER_TEMP/carl-dist"
      - name: Archive validated distributions
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carl-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/carl-dist/*.whl
            ${{ runner.temp }}/carl-dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
