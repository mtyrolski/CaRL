algorithm:
  _target_: carl.algorithms.train_supervised.TrainSupervisedHF
  custom_logger:
    _target_: carl.custom_logger.loggers.NeptuneCaRLLogger
    project: budrowski/test
    name: "test_cllp_network_transformer"
    description: "test_cllp_network_transformer"
    tags: "cllp_training"
    log_parameters: False
  datamodule:
    _target_: carl.dataloader.game_data_module.GameDataModule
    env:
      _target_: carl.environment.sokoban.sokoban.SokobanEnv
      tokenizer:
        _target_: carl.environment.sokoban.sokoban.SokobanTokenizer
        categorical_distance: None
    dataset_path: tests/assets/testing_dataset
    save_tokenized_dataset_path: tests/assets/testing_dataset_tokenized/cllp
    training_goal: cllp
    subgoal_k: 3
    validation_split: 0.1
    batch_size: 2
    num_workers: 1
  custom_metrics:
    _target_: carl.components.metrics.ComponentsMetricsHF
  trainer:
    _target_: transformers.Trainer
    model:
      _target_: transformers.BertForSequenceClassification
      config:
        _target_: transformers.BertConfig
        hidden_size: 32
        intermediate_size: 32
        max_position_embeddings: 512
        num_attention_heads: 2
        num_hidden_layers: 1
        vocab_size: 22
        num_labels: 4
    args:
      _target_: transformers.TrainingArguments
      output_dir: "models_weights/cllp"
      overwrite_output_dir: True
      evaluation_strategy: epoch
      per_device_train_batch_size: 2
      per_device_eval_batch_size: 2
      learning_rate: 0.0001
      weight_decay: 0.0001
      num_train_epochs: 2
      lr_scheduler_type: linear
      log_level: info
      logging_strategy: epoch
      save_strategy: epoch
      save_total_limit: 1
      load_best_model_at_end: True
      metric_for_best_model: eval_loss
      report_to: none

# Other config
float32_matmul_precision: high
