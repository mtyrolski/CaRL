[project]
name = "carl"
version = "0.1.0"
description = ""
authors = []
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "torch>=2.0.1",
    "joblib>=1.3.2",
    "hydra-core>=1.3.2",
    "transformers[torch]>=4.35.0",
    "datasets>=2.14.5",
    "pre-commit>=3.4.0",
    "neptune>=1.7.0",
    "lightning>=2.0.9.post0",
    "wonderwords>=2.2.0",
    "loguru>=0.7.2",
    "torchmetrics>=1.2.0",
    "psutil>=5.9.5",
    "matplotlib>=3.8.0",
    "torch-geometric>=2.3.1",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "ipywidgets>=8.1.1",
    "networkx>=3.2.1",
    "packaging>=23.2",
    "ninja>=1.11.1.1",
    "plotly>=5.19.0",
    "nbformat>=5.9.2",
    "pylint>=3.1.0",
    "jupyter>=1.0.0",
    "kaleido==0.2.1",
    "sns>=0.1",
    "scikit-learn>=1.5.2",
    "gymnasium>=1.0.0",
    "yapf>=0.43.0",
    "tabulate>=0.9.0",
    "crafter>=1.8.3",
    "pygame>=2.6.1",
    "pytest>=8.3.4",
    "pyright>=1.1.402",
    "isort>=6.0.1",
    "ruff>=0.0.278",
    "click>=8.0.0",
    "mypy>=1.4.1",
]

[tool.poetry]
name = "carl"
version = "0.1.0"
description = ""
authors = []
readme = "README.md"

[tool.poetry.dependencies]
python = "3.11.4"
torch = "^2.0.1"
joblib = "^1.3.2"
hydra-core = "^1.3.2"
transformers = {extras = ["torch"], version = "^4.35.0"}
datasets = "^2.14.5"
pre-commit = "^3.4.0"
neptune = "^1.7.0"
lightning = "^2.0.9.post0"
wonderwords = "^2.2.0"
loguru = "^0.7.2"
torchmetrics = "^1.2.0"
psutil = "^5.9.5"
matplotlib = "^3.8.0"
torch-geometric = "^2.3.1"
python-dotenv = "^1.0.0"
numpy = "^1.26.0"
ipywidgets = "^8.1.1"
networkx = "^3.2.1"
packaging = "^23.2"
ninja = "^1.11.1.1"
plotly = "^5.19.0"
nbformat = "^5.9.2"
pylint = "^3.1.0"
jupyter = "^1.0.0"
kaleido = "0.2.1"

sns = "^0.1"
scikit-learn = "^1.5.2"
gymnasium = "^1.0.0"
yapf = "^0.43.0"
tabulate = "^0.9.0"
crafter = "^1.8.3"
pygame = "^2.6.1"
pytest = "^8.3.4"
pyright = "^1.1.402"
isort = "^6.0.1"

[tool.poetry.group.lint.dependencies]
ruff = "^0.0.278"
click = "^8.0.0"
mypy = "^1.4.1"
black = {extras = ["jupyter"], version = "^22.1.0"}


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.23.3"
deptry = "^0.21.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
exclude = [".git", ".mypy_cache", ".ruff_cache", ".venv"]
ignore = ["E712"]
line-length = 150
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# Assume Python 3.10.
target-version = "py310"

[tool.ruff.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

[tool.isort]
single_line_exclusions = ['typing']
multi_line_output = 7
include_trailing_comma = false
line_length = 150
force_single_line = true
comment_prefix = "    #"

[tool.mypy]
exclude = '''(?x)(
    | ^third_party
)'''
warn_return_any = true
check_untyped_defs = true
ignore_missing_imports = true
